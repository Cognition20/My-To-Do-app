<div class="min-h-screen bg-[#140423] flex items-center justify-center">
  <div class="w-full max-w-sm flex flex-col items-center">
    <h1 class="text-2xl text-white font-semibold mb-3 text-center">Log in</h1>
    <form [formGroup]="form" (ngSubmit)="onSubmit()"  class="space-y-4 min-w-full">
      <div >
        <label class="block text-sm font-medium text-white">Email</label>
        <input formControlName="email" type="email" class="mt-1 w-full rounded-md border  text-amber-50 border-purple-800 px-3 py-2 focus:outline-none focus:ring-2 s">
      </div>
      <div >
        <label class="block text-sm font-medium text-white">Password</label>
        <input formControlName="password" type="password" class="mt-1 w-full rounded-md border  text-amber-50 border-purple-800 px-3 py-2 focus:outline-none focus:ring-2">
      </div>

      @if(errorMessage()){
        <p class="text-red-600 text-sm">{{errorMessage()}}</p>
      }

      <button type="submit" [disabled]="isLoading()" class="w-full bg-purple-800 text-white rounded-md py-2 font-medium
              hover:bg-purple-600 hover:scale-105 hover:shadow-lg hover:shadow-purple-500/50
               transition-all duration-200 disabled:opacity-50 disabled:hover:scale-100">
        {{ isLoading() ? 'Logging in...' : 'Log in' }}
      </button>
    </form>
    <p class="mt-2 text-sm text-center text-gray-600">Don't have an account? <a routerLink="/register" class="text-purple-400 hover:underline">Register</a></p>
  </div>
</div>
