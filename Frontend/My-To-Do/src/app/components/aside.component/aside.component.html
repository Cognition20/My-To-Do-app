<aside class="h-full flex flex-col bg-[#140423]  border-r border-purple-900 p-4">
  <div class="flex items-center justify-between mb-3">
    <h2 class="text-sm font-semibold text-gray-500 uppercase">Categories</h2>
    <button (click)="showNewCategoryInput.set(!showNewCategoryInput())"
            class="text-purple-700 hover:text-purple-900 text-lg leading-none">+</button>
  </div>

  @if (showNewCategoryInput()) {
    <div class="mb-1 flex gap-1">
      <input
        [value]="newCategoryName()"
        (input)="newCategoryName.set($any($event.target).value)"
        (keyup.enter)="createCategory()"
        placeholder="New category"
        class="flex-1 rounded border text-amber-50 border-purple-800 px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-purple-400"
      />
    </div>
    @if (errorMessage()) {
      <p class="text-red-600 text-sm">{{ errorMessage() }}</p>
    }
  }

  <ul class="space-y-1 flex-1">
    <li>
      <button
        (click)="select(null)"
        class="w-full text-left px-2 py-1.5 rounded text-sm transition-colors"
        [class]="selectedCategoryId() === null && !searchText() ? 'bg-purple-200 text-purple-900' : 'bg-gray-400 hover:bg-gray-300'"

      >
        All tasks
      </button>
    </li>
    @for (category of categories(); track category.id) {
      <li class="relative">
        @if (editingId() === category.id) {
          <div class="flex gap-1">
            <input
              [value]="editName()"
              (input)="editName.set($any($event.target).value)"
              (keyup.enter)="saveEdit(category.id)"
              (keyup.escape)="cancelEdit()"
              class="flex-1 flex-col rounded border text-amber-50 border-purple-800 px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-purple-400"
            />
            <button (click)="saveEdit(category.id)" class="text-green-600 hover:text-green-800 text-sm px-1">✓</button>
            <button (click)="cancelEdit()" class="text-gray-500 hover:text-gray-700 text-sm px-1">✕</button>
          </div>
        } @else {
          <div class="flex items-stretch rounded overflow-hidden transition-colors"
               [class.bg-purple-200]="selectedCategoryId() === category.id"
               [class.bg-gray-400]="selectedCategoryId() !== category.id"
               [class.hover:bg-gray-300]="selectedCategoryId() !== category.id">
            <button
              (click)="select(category.id)"
              class="flex-1 flex items-center text-left px-2 py-1.5 text-sm"
              [class.text-purple-900]="selectedCategoryId() === category.id"
            >
              {{ category.name }}
            </button>
            <button
              (click)="toggleMenu(category.id, $event)"
              class="flex items-center justify-center   px-2 py-1.5 text-xl"
              [class.text-purple-900]="selectedCategoryId() === category.id"
            >
              <span class="-mt-2.5">...</span>
            </button>
          </div>

          @if (openMenuId() === category.id) {
            <div class="absolute right-0 top-full mt-1 w-28 bg-white rounded-md shadow-lg border border-gray-200 z-10">
              <button
                (click)="startEdit(category, $event)"
                class="w-full text-left px-3 py-1.5 text-sm text-gray-700 hover:bg-gray-100"
              >
                Edit
              </button>
              <button
                (click)="deleteCategory(category.id, $event)"
                class="w-full text-left px-3 py-1.5 text-sm text-red-600 hover:bg-red-50"
              >
                Delete
              </button>
            </div>
          }
        }
      </li>
    }
  </ul>
  <div >
    <app-pagination class=" w-full flex  justify-center pb-6"
      [pageNumber]="categoryPageNumber()"
      [totalPages]="categoryTotalPages()"
      (pageChanged)="categoryPageChanged.emit($event)"></app-pagination>
  </div>

</aside>
