@if (totalPages() > 1) {
  <div class="flex items-center justify-enter gap-2 mt-4">

    <button
      (click)="previousPage()"
      [disabled]="pageNumber() === 1"
      class="px-3 py-1.5 rounded-md bg-purple-800 text-white text-sm
             disabled:opacity-40 hover:bg-purple-600 transition-colors">
      Previous
    </button>

    <span class="text-sm text-gray-400">
      Page {{ pageNumber() }} of {{ totalPages() }}
    </span>

    <button
      (click)="nextPage()"
      [disabled]="pageNumber() === totalPages()"
      class="px-3 py-1.5 rounded-md bg-purple-800 text-white text-sm
             disabled:opacity-40 hover:bg-purple-600 transition-colors">
      Next
    </button>

  </div>
}
